[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "azurator"
version = "0.1.0-alpha.2"
description = "Rotate shared-key credentials for Azure services and update supported places where they are stored."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "azure-ai-projects>=2.3,<2.4",
    "azure-core>=1.37,<2",
    "azure-identity>=1.25,<2",
    "azure-mgmt-cognitiveservices>=14.1,<14.2",
    "azure-mgmt-core>=1.6,<2",
    "azure-mgmt-storage>=25.1,<25.2",
    "azure-mgmt-web>=11.0.1,<11.1",
    "openai>=2.8,<3",
    "platformdirs>=4.3,<5",
    "pydantic>=2.12,<3",
    "rich>=14,<15",
    "typer>=0.24,<1",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

[[project.authors]]
name = "Jan T. Müller"
email = "mail@jantmueller.com"

[project.urls]
homepage = "https://github.com/janthmueller/azurator"
documentation = "https://janthmueller.github.io/azurator/"
source = "https://github.com/janthmueller/azurator"
tracker = "https://github.com/janthmueller/azurator/issues"

[project.scripts]
azurator = "azurator.cli:app"

[project.optional-dependencies]
audit = [
    "pip-audit>=2.9,<3",
]
dev = [
    "hypothesis>=6",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
]
release = [
    "build>=1",
    "pyinstaller>=6",
    "python-semantic-release>=10,<11",
    "twine>=5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["azurator*"]
exclude = ["tests"]

[tool.setuptools.package-data]
azurator = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = ["azurator", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["azurator"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
assets = ["uv.lock"]
commit_parser = "conventional"
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version} [skip ci]\n\nAutomatically generated by python-semantic-release"
build_command = "python .github/scripts/sync_lock_version.py \"$NEW_VERSION\" && python -m build"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.publish]
upload_to_vcs_release = true
